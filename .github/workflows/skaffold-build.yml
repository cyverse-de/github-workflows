name: skaffold-build

on:
  workflow_call:
    inputs:
      build-prerelease:
        description: deprecated and ignored; builds publish a descriptor, not a GitHub release
        required: false
        default: false
        type: boolean
      service-name:
        description: deployments service role name; defaults to this repo's name
        default: ""
        type: string
      deployments-repo:
        default: cyverse-de/deployments
        type: string
      deployments-branch:
        default: main
        type: string
    secrets:
      harbor-username:
        required: true
      harbor-password:
        required: true
      releases-repo-push-token:
        required: true

jobs:
  pipeline:
    name: Skaffold Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Set Environment
        id: set_environment
        run: |
          service="${{ inputs.service-name }}"
          echo "SERVICE_NAME=${service:-${GITHUB_REPOSITORY##*/}}" >> "${GITHUB_ENV}"

      - name: Checkout Source Repo
        id: checkout
        uses: actions/checkout@v6
        with:
          path: "${{ env.SERVICE_NAME }}"
          fetch-depth: 0

      - name: Checkout Deployments Repo
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.deployments-repo }}
          ref: ${{ inputs.deployments-branch }}
          path: deployments
          token: ${{ secrets.releases-repo-push-token }}

      - name: Verify the service role exists
        run: |
          role_dir="deployments/ansible/roles/services/${SERVICE_NAME}"
          if [ ! -d "${role_dir}" ]; then
            echo "::error::No service role at ${role_dir}. The repo name must match a" \
              "deployments service role, or pass service-name. build_it.yml would" \
              "otherwise match no --tags and silently build nothing."
            exit 1
          fi

      - name: Harbor Login
        id: harbor_login
        uses: docker/login-action@v4
        with:
          registry: harbor.cyverse.org
          username: ${{ secrets.harbor-username }}
          password: ${{ secrets.harbor-password }}

      - name: Set up docker buildx
        id: install_docker_buildx
        uses: docker/setup-buildx-action@v4

      - name: Install skaffold
        run: |
          sudo curl -fsSL -o /usr/local/bin/skaffold \
            https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64
          sudo chmod +x /usr/local/bin/skaffold

      - name: Install ansible
        run: pipx install ansible-core

      - name: Build and update the descriptor
        run: |
          printf '[k8s_controllers]\nlocalhost ansible_connection=local\n' > inventory.ini
          ansible-playbook -i inventory.ini deployments/ansible/build_it.yml \
            --tags "${SERVICE_NAME}" \
            -e source_repo="${GITHUB_WORKSPACE}/${SERVICE_NAME}" \
            -e git_ref="${GITHUB_REF_NAME}" \
            -e push_images=true

      - name: Commit the updated descriptor
        env:
          DEPLOYMENTS_BRANCH: ${{ inputs.deployments-branch }}
        run: |
          cd deployments
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"
          git add "ansible/roles/services/${SERVICE_NAME}/files/${SERVICE_NAME}.json"
          if git diff --cached --quiet; then
            echo "descriptor unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "updated the build descriptor for ${SERVICE_NAME}"
          # Other services building concurrently push their own descriptors to
          # the same branch, so a plain push loses the race with a
          # non-fast-forward rejection. Rebase onto the latest tip and retry;
          # distinct services touch distinct files, so the rebase applies cleanly.
          for attempt in $(seq 1 5); do
            if git push origin "HEAD:${DEPLOYMENTS_BRANCH}"; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}/5); rebasing on ${DEPLOYMENTS_BRANCH} and retrying"
            sleep $((attempt * 3))
            git pull --rebase origin "${DEPLOYMENTS_BRANCH}"
          done
          echo "::error::failed to push the descriptor after 5 attempts;" \
            "concurrent descriptor updates kept winning the race. Re-run this job."
          exit 1
